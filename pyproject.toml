[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omd-mcp"
version = "1.1.0"
description = "Version-scoped ESMF 8.9.1 sections and Fortran routines for NUOPC agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "beautifulsoup4>=4.12,<5"]

[tool.setuptools]
py-modules = ["knowledge", "server", "ingest", "fetch_corpus", "fetch_kokkos", "fetch_standards"]
